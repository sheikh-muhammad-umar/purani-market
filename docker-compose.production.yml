version: "3.8"

# Production overrides — use with: docker compose -f docker-compose.yml -f docker-compose.production.yml up
services:
  mongodb:
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: marketplace_production

  redis:
    command: redis-server --requirepass ${REDIS_PASSWORD}

  elasticsearch:
    environment:
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
    # The base healthcheck calls _cluster/health anonymously, which returns 401
    # once security is on — the container would never report healthy and the
    # backend, which waits on it, would never start.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fs -u elastic:$${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health || exit 1",
        ]

  backend:
    env_file:
      - ./backend/.env.production
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/marketplace_production?authSource=admin
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # Both .env files ship these blank, and the client only sends credentials
      # when username and password are both set.
      ELASTICSEARCH_USERNAME: elastic
      ELASTICSEARCH_PASSWORD: ${ELASTIC_PASSWORD}
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
        max_attempts: 3
