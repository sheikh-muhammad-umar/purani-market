<div class="category-browse-page">
  <header class="page-header">
    <h1 class="page-title">Browse Categories</h1>
    <p class="page-subtitle">Find what you're looking for by category</p>
  </header>

  @if (loading()) {
    <div class="categories-grid">
      @for (i of SKELETON_ITEMS; track i) {
        <app-category-card [loading]="true" />
      }
    </div>
  } @else if (topLevelCategories().length === 0) {
    <app-empty-state
      icon="grid_view"
      title="No categories available"
      message="Categories aren't available at the moment. Please try again shortly."
    />
  } @else {
    <div class="categories-grid" role="list" aria-label="Product categories">
      @for (category of topLevelCategories(); track category._id) {
        <app-category-card
          role="listitem"
          [name]="category.name"
          [iconUrl]="getCategoryImage(category)"
          [subtitle]="subcategoryLabel(category._id)"
          (selected)="openCategoryModal(category)"
        />
      }
    </div>
  }
</div>

@if (selectedCategory()) {
  <app-category-modal
    [allCategories]="allCategories()"
    [rootCategory]="selectedCategory()"
    (closed)="closeCategoryModal()"
  />
}
