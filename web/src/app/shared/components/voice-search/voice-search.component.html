<button
  type="button"
  class="voice-lang-toggle"
  [class.mobile]="mobile()"
  [disabled]="voiceSearchActive()"
  (click)="switchLanguage($event)"
  [title]="'Voice language: ' + activeLanguage().label + ' — tap for ' + nextLanguage().label"
  [attr.aria-label]="
    'Voice search language, currently ' +
    activeLanguage().label +
    '. Activate to switch to ' +
    nextLanguage().label
  "
>
  <span [attr.lang]="activeLanguage().code" aria-hidden="true">{{ activeLanguage().short }}</span>
</button>

<button
  [class]="mobile() ? 'mobile-voice-btn' : 'voice-search-btn'"
  [class.voice-active]="voiceSearchActive()"
  (mousedown)="onVoiceDown($event)"
  (mouseup)="onVoiceUp($event)"
  (mouseleave)="onVoiceLeave()"
  (touchstart)="onVoiceDown($event)"
  (touchend)="onVoiceUp($event)"
  (touchmove)="onVoiceMove($event)"
  [title]="'Hold to speak (' + activeLanguage().label + ')'"
  [attr.aria-label]="'Hold to speak for voice search in ' + activeLanguage().label"
>
  <span class="material-symbols-rounded" aria-hidden="true">mic</span>
</button>

@if (voiceSearchActive()) {
  <div class="voice-listening-indicator">
    <div class="voice-pulse"></div>
    <span
      class="voice-transcript-live"
      [attr.lang]="activeLanguage().code"
      [attr.dir]="activeLanguage().code === 'ur-PK' ? 'rtl' : 'ltr'"
      >{{ voiceSearch.interimTranscript() || LISTENING_LABEL }}</span
    >
    <span class="voice-hint">{{ activeLanguage().label }} · {{ HINT_LABEL }}</span>
  </div>
}

@if (voiceSearchError()) {
  <div class="voice-error-tooltip">{{ voiceSearchError() }}</div>
}
