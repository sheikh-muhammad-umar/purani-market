<app-header />
<main class="app-main">
  <router-outlet />
</main>
@if (!hideFooter()) {
  <app-footer />
}
<app-login-modal />
<app-confirm-modal />
<app-toast />

@if (emailVerificationModal.isOpen()) {
  <app-email-verification-modal />
}

@if (phoneVerificationModal.isOpen()) {
  <app-phone-verification-modal />
}

@if (showScrollTop()) {
  <button class="scroll-top-btn" (click)="scrollToTop()" aria-label="Scroll to top">
    <span class="material-symbols-rounded">arrow_upward</span>
  </button>
}
