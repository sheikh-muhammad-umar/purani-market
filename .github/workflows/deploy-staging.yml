name: Deploy — Staging

on:
  push:
    branches: [main]

# Least privilege: none of these jobs write to the repository, and the default
# GITHUB_TOKEN grants more than they need.
permissions:
  contents: read

jobs:
  deploy-staging:
    name: Build & Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.REGISTRY_URL }}/marketplace-backend:staging-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to staging server
        uses: appleboy/ssh-action@v1
        # The registry URL is forwarded to the remote shell as an environment
        # variable instead of being spliced into the script text, so it stays out
        # of the staging host's shell history and any `set -x` trace. `envs`
        # names which of this step's variables ssh-action exports on the far side
        # — the remote shell inherits nothing from the runner on its own.
        env:
          IMAGE_TAG: staging-${{ github.sha }}
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          envs: IMAGE_TAG,REGISTRY_URL
          script: |
            set -euo pipefail
            cd /opt/marketplace
            docker compose -f docker-compose.yml -f docker-compose.staging.yml pull backend
            docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d --no-deps backend
            docker image prune -f
